services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hephaestus
      POSTGRES_USER: hephaestus
      POSTGRES_PASSWORD: hephaestus
    ports:
      - "5433:5432"
    volumes:
      - hephaestus-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hephaestus -d hephaestus"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/hephaestus
      DB_USERNAME: hephaestus
      DB_PASSWORD: hephaestus
      # Required. `?err` makes compose refuse to start rather than silently
      # falling back to a committed placeholder, which is what used to happen.
      # Generate one with: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - see .env.example}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  hephaestus-db-data:
