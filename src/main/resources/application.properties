spring.application.name=hephaestus

# --- datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hephaestus}
spring.datasource.username=${DB_USERNAME:hephaestus}
spring.datasource.password=${DB_PASSWORD:hephaestus}

# --- jpa / flyway (Flyway owns the schema; Hibernate only validates) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- jwt (HS256) ---
# NO DEFAULT, deliberately. This previously fell back to a placeholder string
# committed to a public repository, and docker-compose never set JWT_SECRET, so
# `docker compose up` produced a running service signing tokens with a key
# anyone could read off GitHub - enough to forge a token for any account.
# Startup now fails loudly instead of starting insecurely.
# Generate one with: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
