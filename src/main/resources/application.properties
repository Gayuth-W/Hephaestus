spring.application.name=hephaestus

# --- datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hephaestus}
spring.datasource.username=${DB_USERNAME:hephaestus}
spring.datasource.password=${DB_PASSWORD:hephaestus}

# --- jpa / flyway (Flyway owns the schema; Hibernate only validates) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- jwt (HS256; secret is a raw string >= 32 chars; override in real deployments) ---
app.jwt.secret=${JWT_SECRET:change-me-please-use-a-long-random-secret-string-32b+}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# --- demo users (override via env) ---
app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:admin}
app.security.viewer-username=${VIEWER_USERNAME:viewer}
app.security.viewer-password=${VIEWER_PASSWORD:viewer}